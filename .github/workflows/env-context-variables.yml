name: variables-context

on:
  workflow_dispatch:

env:
  APP_NAME: github-actions

jobs:
  print-env-variables-context:
    runs-on: ubuntu-latest
    steps:
      - name: Print ENV variables context
        run: |
          echo "APP_NAME: ${{ env.APP_NAME }}"

  print-config-variables-context:
    runs-on: ubuntu-latest
    steps:
      - name: Print config variables context
        run: |
          echo "APP_CONFIG: ${{ vars.APP_CONFIG }}"

  print-secrets-variables-context:
    runs-on: ubuntu-latest
    steps:
      - name: Print secrets variables context
        run: |
          echo "APP_SECRET: ${{ secrets.MY_APP_SECRET }}"
