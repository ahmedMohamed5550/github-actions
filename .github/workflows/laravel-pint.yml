name: Fix Code Style with Laravel Pint

on:
  pull_request:
    types: [closed]
    branches:
      - master

permissions:
  contents: write

jobs:
  pint:
    runs-on: ubuntu-latest

    # Only run when the pull request was merged
    if: github.event.pull_request.merged == true

    steps:

      # Checkout the repository
      - name: Checkout repository base branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      # Setup PHP 8.4 and install Pint directly
      - name: Setup PHP and Pint
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: pint

      # Run Laravel Pint to format code
      - name: Run Laravel Pint
        run: pint

      # Commit and push style fixes back to the base branch
      - name: Commit and push style fixes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Fix code style with Laravel Pint"
            git push origin ${{ github.event.pull_request.base.ref }}
          else
            echo "No code style changes to commit."
          fi

