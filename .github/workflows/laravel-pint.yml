name: Fix Code Style with Laravel Pint

on:
  pull_request:
    types: [closed]
    branches:
      - master

permissions:
  contents: write

jobs:
  pint:
    runs-on: ubuntu-latest

    # Only run when the pull request was merged
    if: github.event.pull_request.merged == true

    steps:

      # Checkout the repository
      - name: Checkout repository base branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Install Laravel Pint
        run: composer require --dev laravel/pint

      - name: Run Laravel Pint
        run: ./vendor/bin/pint

      - name: Commit and push style fixes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Fix code style with Laravel Pint" || echo "No changes to commit"
          git push origin ${{ github.event.pull_request.base.ref }}

