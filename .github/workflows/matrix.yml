name: Matrix-Example

on: workflow_dispatch

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      max-parallel: 2
      matrix: # one dimension matrix or multi-dimension matrix
        os: [ubuntu-latest,windows-latest]
        php_version: [8.2, 8.3]
        exclude:
          - os: windows-latest
            php_version: 8.3
        include:
          - os: ubuntu-latest
            php_version: 8.4
    steps:
      - name: "Build step 1"
        run: echo "This is a build step that runs on ${{ matrix.os }}."
